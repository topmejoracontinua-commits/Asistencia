<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Reporte de Asistencias - Top Neumaticos</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    background: #eef0f2;
    margin: 0;
    padding: 40px 16px;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    max-width: 480px;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.1);
  }
  .banner {
    background: #0c0c0c;
    color: #fff;
    padding: 28px 32px;
    border-bottom: 4px solid #d11a1a;
    text-align: center;
  }
  .banner .tag {
    display: inline-block;
    background: #d11a1a;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .banner h1 { margin: 0 0 6px 0; font-size: 21px; font-weight: 700; }
  .banner p { margin: 0; color: #c7c7c7; font-size: 13px; }

  .contenido { padding: 32px; text-align: center; }
  .contenido p.descripcion {
    font-size: 14px;
    color: #555;
    line-height: 1.5;
    margin: 0 0 24px 0;
  }

  .btn-generar {
    background: #d11a1a;
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
  }
  .btn-generar:hover:not(:disabled) { background: #ad1414; }
  .btn-generar:disabled { background: #e5a3a3; cursor: not-allowed; }

  .estado {
    margin-top: 18px;
    font-size: 13.5px;
    min-height: 20px;
  }
  .estado.cargando { color: #6b7280; }
  .estado.exito { color: #16803c; font-weight: 600; }
  .estado.error { color: #d11a1a; font-weight: 600; }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #d1d5db;
    border-top-color: #d11a1a;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    animation: girar 0.7s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  .footer {
    text-align: center;
    color: #9ca3af;
    font-size: 11.5px;
    padding: 14px 0 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <span class="tag">Registro de Asistencias del Personal</span>
      <h1>Generador de Reporte de Asistencias</h1>
      <p>Top Neumaticos S.R.L.</p>
    </div>
    <div class="contenido">
      <p class="descripcion">
        Al presionar el botón se genera el reporte de asistencias del mes anterior
        y se envía por mail automáticamente.
      </p>
      <button class="btn-generar" id="btnGenerar" onclick="generarReporte()">
        Generar reporte del mes anterior
      </button>
      <div class="estado" id="estado"></div>
    </div>
  </div>
  <p class="footer">Top Neumaticos S.R.L. · Herramienta interna</p>

  <script>
    // Reemplazar por la URL de PRODUCCIÓN del webhook (no la de test)
    const WEBHOOK_URL = "https://envy-recollect-last.ngrok-free.dev/webhook/asistencia";

    async function generarReporte() {
      const btn = document.getElementById('btnGenerar');
      const estado = document.getElementById('estado');

      btn.disabled = true;
      estado.className = 'estado cargando';
      estado.innerHTML = '<span class="spinner"></span>Generando reporte, puede tardar unos segundos...';

      try {
        const respuesta = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ origen: 'boton-web', fecha: new Date().toISOString() })
        });

        if (!respuesta.ok) {
          throw new Error('El servidor respondió con error ' + respuesta.status);
        }

        estado.className = 'estado exito';
        estado.textContent = '✓ Reporte generado y enviado correctamente.';
      } catch (error) {
        estado.className = 'estado error';
        estado.textContent = '✗ No se pudo generar el reporte: ' + error.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
